openapi: 3.0.0
info:
  title: Commerce API
  version: 1.0.0
x-okapipy-ns:
  - commerce
paths:
  /commerce/orders:
    get:
      summary: List orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
    post:
      summary: Create order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /commerce/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Retrieve order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    delete:
      summary: Delete order
      responses:
        '204':
          description: No content
  /commerce/orders/{id}/lines:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List order lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLineList'
  /commerce/orders/{id}/lines/{line_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: line_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Retrieve line
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLine'
  /commerce/orders/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Submit order
      x-okapipy: action
      responses:
        '200':
          description: OK
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
    OrderLine:
      type: object
      properties:
        id:
          type: string
    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer
    OrderLineList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: integer
