openapi: 3.0.0
info:
  title: Non-paginated API
  version: 1.0.0
x-okapipy-paginated: false
paths:
  /items:
    get:
      summary: List items (non-paginated)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
    ItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
