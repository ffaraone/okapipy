site_name: okapipy
site_description: Python OpenAPI client generator that lifts flat OpenAPI paths into a typed, hierarchical Python client.
site_url: https://ffaraone.github.io/okapipy/
site_author: Francesco Faraone

repo_name: ffaraone/okapipy
repo_url: https://github.com/ffaraone/okapipy
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 Francesco Faraone — Apache-2.0 licensed

# Emit foo.html instead of foo/index.html so the built site is browsable
# directly from the filesystem (file:// URLs) without a web server.
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            members_order: source
            merge_init_into_class: true
            show_bases: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters:
              - "!^_"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - User Guide:
      - user-guide/installation.md
      - user-guide/quick-start.md
      - user-guide/client-usage.md
      - user-guide/rules.md
      - user-guide/strategies.md
      - user-guide/customization.md
      - user-guide/templates.md
  - Developer Guide:
      - developer-guide/index.md
      - developer-guide/parser.md
      - developer-guide/generator.md
  - Reference:
      - reference/cli.md
      - reference/parser.md
      - reference/generator.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ffaraone/okapipy
      name: okapipy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/okapipy/
      name: okapipy on PyPI
