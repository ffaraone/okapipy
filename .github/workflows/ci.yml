name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache spaCy model
        uses: actions/cache@v4
        with:
          path: .spacy
          key: spacy-en_core_web_sm-${{ runner.os }}

      - name: Pre-download spaCy model
        run: uv run okapipy fetch-language en

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type-check
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

      - name: Upload test reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: SonarCloud scan + quality gate
    needs: checks
    runs-on: ubuntu-latest
    # Skip on PRs from forks: SONAR_TOKEN isn't exposed there and the scan would fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute issues via git blame.
          fetch-depth: 0

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: reports

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
