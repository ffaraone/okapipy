name: Docs (manual)

# Manual escape hatch for re-deploying the docs site without cutting a new
# release — e.g. fixing a typo or rebuilding after a theme upgrade.
#
# The release-driven docs deploy lives in `release.yml` as a `docs` job that
# only runs after the PyPI publish succeeds. Keep these two paths in sync.

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write   # mkdocs gh-deploy pushes to the gh-pages branch

jobs:
  build:
    name: Build & deploy mkdocs-material to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # gh-deploy needs the full history so it can rewrite gh-pages cleanly.
          fetch-depth: 0

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (incl. docs group)
        run: uv sync --locked --group docs

      - name: Configure git identity for gh-deploy
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy
        run: uv run mkdocs gh-deploy --force --clean --verbose
